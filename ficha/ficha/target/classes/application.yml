spring:
  application:
    name: hospitalficha
  datasource:
    url: jdbc:mysql://localhost:3306/ficha_db
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8071

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true 
